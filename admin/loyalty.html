</tbody>

<script>
async function loadPoints() {

  const adminKey = localStorage.getItem("adminKey");

  const response = await fetch("/api/all-points", {
    headers: {
      "x-admin-key": adminKey
    }
  });

  const data = await response.json();

  if (!Array.isArray(data)) {
    console.error("API Error:", data);
    document.getElementById("pointsTable").innerHTML =
      `<tr>
        <td colspan="3">Unauthorized or No Data Found</td>
      </tr>`;
    return;
  }

  const pointsTable =
    document.getElementById("pointsTable");

  pointsTable.innerHTML = data.map(p => {

    let tier = "Bronze 🥉";

    if (p.points >= 100)
      tier = "Silver 🥈";

    if (p.points >= 500)
      tier = "Gold 🥇";

    if (p.points >= 1000)
      tier = "Platinum 💎";

    return `
      <tr>
        <td>${p.phone}</td>
        <td>${p.points}</td>
        <td>${tier}</td>
      </tr>
    `;

  }).join("");
}

loadPoints();
</script>
