<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Website Settings</title>
  <link rel="stylesheet" href="/admin/css/style.css">
</head>

<body>

<div class="admin-layout">

  <aside class="sidebar">
    <h2 id="adminName">Rupa Cafe Admin Panel</h2>

    <a href="/admin/dashboard.html">
Dashboard
</a>

<a href="/admin/menu.html">

</a>

<a href="/admin/orders.html">
Customer Orders
</a>
<a href="/admin/reviews.html">

<a href="/admin/coupons.html">

</a>
<a href="/admin/loyalty.html">
Loyalty Points

Website Settings
</a>

<a href="/">
View Frontend
</a>

<a
href="#"

onclick="logout()">

Logout

</a>

  </aside>

  <main class="main">

    <h1>Website Settings</h1>

    <div class="form-box">

      <input id="name" placeholder="Restaurant Frontend Name">

      <input id="adminNameInput" placeholder="Admin Panel Name">

      <input id="hero" placeholder="Hero Heading">
      <input id="whatsapp"
      placeholder="WhatsApp Number (91XXXXXXXXXX)">

      <textarea id="heroText" placeholder="Hero Subtitle"></textarea>

      <textarea id="offer" placeholder="Special Offer"></textarea>
      <h3>Hero Slider Images</h3>

<input
id="heroImage1"
placeholder="Cloudinary Hero Image 1 URL">

<input
type="file"
id="heroUpload1"
accept="image/*">

<img
id="heroPreview1"
style="
width:150px;
margin-top:10px;
display:block;
">

<input
id="heroImage2"
placeholder="Cloudinary Hero Image 2 URL">
<input
type="file"
id="heroUpload2"
accept="image/*">

<img
id="heroPreview2"
style="
width:150px;
margin-top:10px;
display:block;
">
<input
id="heroImage3"
placeholder="Cloudinary Hero Image 3 URL">
<input
type="file"
id="heroUpload3"
accept="image/*">

<img
id="heroPreview3"
style="
width:150px;
margin-top:10px;
display:block;
">
<input
id="heroImage4"
placeholder="Cloudinary Hero Image 4 URL">
<input
type="file"
id="heroUpload4"
accept="image/*">

<img
id="heroPreview4"
style="
width:150px;
margin-top:10px;
display:block;
">
      <textarea id="contact" placeholder="Contact Details"></textarea>

      <textarea id="copyrightInput" placeholder="Copyright Text"></textarea>
      <input
id="instagramInput"
placeholder="Instagram URL">

<input
id="facebookInput"
placeholder="Facebook URL">
          <textarea
id="invoiceFooter"
placeholder="Invoice Footer Message">
</textarea>
      <button class="btn" onclick="saveSite()">
        Save Website Settings
      </button>

    </div>

  </main>

</div>

<script src="/admin/js/admin.js"></script>

<script>

async function uploadHero(
fileInputId,
urlInputId,
previewId
){

const file =
document.getElementById(
fileInputId
).files[0];

if(!file) return;

const fd =
new FormData();

fd.append(
"image",
file
);

const r =
await fetch(
"/api/upload-hero",
{
method:"POST",

headers:{
"x-admin-key":
localStorage.getItem(
"adminKey"
)
},

body:fd
}
);

const data =
await r.json();

if(data.success){

document.getElementById(
urlInputId
).value =
data.url;

document.getElementById(
previewId
).src =
data.url;

}

}

async function loadSite(){

  const s = await fetch("/api/site").then(r => r.json());

  document.getElementById("name").value =
  s.name || "";

  document.getElementById("adminNameInput").value =
  s.adminName || "";

  document.getElementById("hero").value =
  s.hero || "";

  document.getElementById("heroText").value =
  s.heroText || "";

  document.getElementById("offer").value =
  s.offer || "";

  document.getElementById("heroImage1").value =
  s.heroImage1 || "";

  document.getElementById("heroImage2").value =
  s.heroImage2 || "";

  document.getElementById("heroImage3").value =
  s.heroImage3 || "";

  document.getElementById("heroImage4").value =
  s.heroImage4 || "";

  document.getElementById("contact").value =
  s.contact || "";
  document.getElementById("whatsapp").value =
  s.whatsapp || "";

  document.getElementById("copyrightInput").value =
  s.copyright || "";
  document.getElementById(
"instagramInput"
).value =
s.instagram || "";

document.getElementById(
"facebookInput"
).value =
s.facebook || "";
  document.getElementById("invoiceFooter").value =
s.invoiceFooter || "";
  document.getElementById("adminName").innerText =
  s.adminName || "Rupa Cafe Admin Panel";
  document.getElementById(
"heroPreview1"
).src =
s.heroImage1 || "";

document.getElementById(
"heroPreview2"
).src =
s.heroImage2 || "";

document.getElementById(
"heroPreview3"
).src =
s.heroImage3 || "";

document.getElementById(
"heroPreview4"
).src =
s.heroImage4 || "";
}

async function saveSite(){

  await fetch("/api/site", {
    method: "PUT",
    headers: {
  "Content-Type": "application/json",

  "x-admin-key":
  localStorage.getItem("adminKey")
},
    body: JSON.stringify({
      name: document.getElementById("name").value,
      adminName: document.getElementById("adminNameInput").value,
      hero: document.getElementById("hero").value,
      heroText: document.getElementById("heroText").value,
      offer: document.getElementById("offer").value,
      heroImage1:
             document.getElementById("heroImage1").value,

      heroImage2:
             document.getElementById("heroImage2").value,

      heroImage3:
             document.getElementById("heroImage3").value,

      heroImage4:
             document.getElementById("heroImage4").value,
      contact: document.getElementById("contact").value,
      whatsapp: document.getElementById("whatsapp").value,
      copyright: document.getElementById("copyrightInput").value,
      instagram:document.getElementById("instagramInput").value,
      facebook:document.getElementById("facebookInput").value,
      invoiceFooter:document.getElementById("invoiceFooter").value
    })
  });

  alert("Website settings saved successfully");
     document
.getElementById(
"heroUpload1"
)
.addEventListener(
"change",
()=>{
uploadHero(
"heroUpload1",
"heroImage1",
"heroPreview1"
);
}
);

document
.getElementById(
"heroUpload2"
)
.addEventListener(
"change",
()=>{
uploadHero(
"heroUpload2",
"heroImage2",
"heroPreview2"
);
}
);

document
.getElementById(
"heroUpload3"
)
.addEventListener(
"change",
()=>{
uploadHero(
"heroUpload3",
"heroImage3",
"heroPreview3"
);
}
);

document
.getElementById(
"heroUpload4"
)
.addEventListener(
"change",
()=>{
uploadHero(
"heroUpload4",
"heroImage4",
"heroPreview4"
);
}
);
  loadSite();
}

loadSite();
</script>
<script>
if(localStorage.getItem("darkMode")==="true"){
    document.body.classList.add("dark-mode");
}
</script>
</body>
</html>
