<script>

    window.location.href = "/#menu";
}
</script>

<script>

async function loadAccount(){

try{

const user =
JSON.parse(localStorage.getItem("rupaUser"));
if(!user.phone){
user.phone = user.email;
}

console.log("USER =", user);
console.log(user);
console.log(user.phone);
if(!user){
location.href="/login.html";
return;
}

document.getElementById("userName").innerText=user.name||"";
document.getElementById("userPhone").innerText=user.phone||"";
document.getElementById("userEmail").innerText=user.email||"";

const ordersRes =
await fetch("/api/my-orders/" + encodeURIComponent(user.phone));
let orders = [];
orders = await ordersRes.json();

document.getElementById("orderCount").innerText =
orders.length;

// LOAD FAVORITES
let favs = [];

try{

const favsRes =
await fetch("/api/favorites/" + encodeURIComponent(user.phone));

favs =
await favsRes.json();

}catch(e){

console.log(
"Favorites Error",
e
);

}

document.getElementById(
"favoriteCount"
).innerText =
favs.length;

if(favs.length){

document.getElementById(
"favoriteFoods"
).innerHTML =

favs.map(f=>`

<div class="card">

<h3>${f.name || "Food Item"}</h3>

<p>₹${f.price || 0}</p>

</div>

`).join("");

}else{

document.getElementById(
"favoriteFoods"
).innerHTML =

"<h3>No Favourite Foods</h3>";

}


// LOAD NOTIFICATIONS

let notifications = [];

try{

const notifRes =
await fetch("/api/notifications/" + encodeURIComponent(user.phone));

notifications =
await notifRes.json();
console.log("ORDERS =", orders);
console.log("FAVS =", favs);
console.log("NOTIFICATIONS =", notifications);
}catch(e){

console.log(
"Notification Error",
e
);

}

document.getElementById(
"notificationCount"
).innerText =
notifications.length;

if(notifications.length){

document.getElementById(
"notificationList"
).innerHTML =

notifications.map(n=>`

<div class="card">

<p>${n.message}</p>

</div>

`).join("");

}else{

document.getElementById(
"notificationList"
).innerHTML =

"<h3>No Notifications</h3>";

}

if(orders.length){

document.getElementById("recentOrders").innerHTML =
orders.slice(0,3).map(order=>`

<div class="card">

<h3>Order #${order.id}</h3>

<p>Status: ${order.status}</p>

<p>Total: ₹${order.total}</p>

<button
class="btn"
onclick="downloadInvoice(${order.id})">

📄 Download Invoice

</button>

</div>

`).join("");

document.getElementById("orderHistory").innerHTML =
orders.map(order=>`

<div class="card">

<h3>Order #${order.id}</h3>

<p>Status: ${order.status}</p>

<p>Total: ₹${order.total}</p>

<button
class="btn"
onclick="downloadInvoice(${order.id})">

📄 Download Invoice

</button>

</div>

`).join("");

}else{

document.getElementById("recentOrders").innerHTML =
"<h3>No Recent Orders</h3>";

document.getElementById("orderHistory").innerHTML =
"<h3>No Order History</h3>";

}

}catch(err){

console.error(err);

document.getElementById(
"orderHistory"
).innerHTML =
"<h3>Failed To Load Orders</h3>";

document.getElementById(
"favoriteFoods"
).innerHTML =
"<h3>Failed To Load Favorites</h3>";

document.getElementById(
"notificationList"
).innerHTML =
"<h3>Failed To Load Notifications</h3>";

}

}
async function clearNotifications(){

const user =
JSON.parse(
localStorage.getItem(
"rupaUser"
)
);

if(
!confirm(
"Clear all notifications?"
)
){
return;
}

await fetch(
"/api/notifications/" +
encodeURIComponent(user.phone),
{
method:"DELETE"
}
);

loadAccount();

}
loadAccount();

function downloadInvoice(orderId){

const user =
JSON.parse(localStorage.getItem("rupaUser"));

fetch("/api/my-orders/" + encodeURIComponent(user.phone))
.then(r => r.json())
.then(orders => {

const order =
orders.find(
o => o.id == orderId
);

if(!order){
alert("Order not found");
return;
}

const invoiceWindow =
window.open("", "_blank");

invoiceWindow.document.write(`

<html>
<head>
<title>Invoice ${order.id}</title>

<style>

body{
font-family:Arial;
padding:20px;
}

h1{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ccc;
padding:8px;
}

</style>

</head>

<body>

<h1>Rupa Cafe Invoice</h1>

<p><b>Order ID:</b> ${order.id}</p>
<p><b>Customer:</b> ${order.customer}</p>
<p><b>Phone:</b> ${order.phone}</p>
<p><b>Status:</b> ${order.status}</p>

<table>

<tr>
<th>Item</th>
<th>Qty</th>
<th>Price</th>
</tr>

${order.items.map(item => `
<tr>
<td>${item.name}</td>
<td>${item.qty}</td>
<td>₹${item.price}</td>
</tr>
`).join("")}

</table>

<h2>Total: ₹${order.total}</h2>

</body>
</html>

`);

invoiceWindow.document.close();

invoiceWindow.print();

});

}
function downloadInvoice(orderId){

window.open(
"/api/invoice/" + orderId,
"_blank"
);

}
</script>
