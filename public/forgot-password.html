<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<link
rel="stylesheet"
href="/css/style.css">

</head>

<body>

<div class="cart-box">

<h2>Reset Password</h2>

<input
id="email"
placeholder="Registered Email">

<button
class="btn"
onclick="sendOTP()">

Send OTP

</button>

<br><br>

<input
id="otp"
placeholder="Enter OTP">

<input
id="newPassword"
type="password"
placeholder="New Password">

<button
class="btn"
onclick="resetPassword()">

Reset Password

</button>

</div>
<script>

let otpVerified = false;

async function sendOTP(){

const email =
document.getElementById(
"email"
).value.trim();

if(!email){

alert(
"Enter Email"
);

return;
}

const res =
await fetch(
"/api/send-otp",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email
})

});

const data =
await res.json();

if(!data.success){

alert(
data.message ||
"Failed to send OTP"
);

return;
}

alert(
"OTP Sent Successfully 📧"
);

}

async function resetPassword(){

const email =
document.getElementById(
"email"
).value.trim();

const otp =
document.getElementById(
"otp"
).value.trim();

const password =
document.getElementById(
"newPassword"
).value;

const verify =
await fetch(
"/api/verify-otp",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
otp

})

});

const verifyData =
await verify.json();

if(!verifyData.success){

alert(
"Invalid OTP"
);

return;
}

const res =
await fetch("/api/reset-password",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

email:
document.getElementById("email").value,

password:
document.getElementById("newPassword").value

})
});

const data =
await res.json();

if(!data.success){

alert(
data.message
);

return;
}

alert(
"Password Updated Successfully ✅"
);

location.href =
"/login.html";

}

</script>

</body>
</html>
