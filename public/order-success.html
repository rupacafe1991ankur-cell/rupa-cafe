<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Order Success</title>

<style>

body{

font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f7f7f7;

}

.box{

background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.1);

}

.btn{

padding:12px 25px;
border:none;
border-radius:10px;
cursor:pointer;
margin:10px;

}

</style>

</head>

<body>

<div class="box">

<h1>🎉 Order Placed Successfully</h1>

<h2 id="orderId"></h2>

<p>
Thank you for ordering from Rupa Cafe ❤️
</p>

<button
class="btn"
onclick="goTrack()">

📦 Track Order

</button>

<button
class="btn"
onclick="location.href='/'">

🏠 Home

</button>

</div>

<script>

const id =
localStorage.getItem(
"lastOrderId"
);

document.getElementById(
"orderId"
).innerText =
"Order #" + id;

function goTrack(){

location.href =
"/#track";

}

</script>

</body>

</html>
