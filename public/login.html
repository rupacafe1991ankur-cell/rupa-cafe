<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - Rupa Cafe</title>

<link
rel="stylesheet"
href="/css/style.css">

</head>

<body>

<div class="auth-page">
<div class="auth-box">

<h2>
Customer Login
</h2>

<input
id="loginEmail"
type="email"
placeholder="Email Address">

<input
id="loginPassword"
type="password"
placeholder="Password">

<button
class="btn"
onclick="loginUser()">

Login

</button>
<p style="text-align:center;">
<a href="/forgot-password.html">
Forgot Password?
</a>
</p>


<p>

Don't have an account?

<a href="/register.html">

Register

</a>

</p>

</div>
</div>div
<script>

async function loginUser(){

const email =
document.getElementById(
"loginEmail"
).value.trim();

const password =
document.getElementById(
"loginPassword"
).value;

const res =
await fetch(
"/api/login",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
password
})

});

const data =
await res.json();

if(!data.success){

alert(
data.message
);

return;

}
if(!data.user.phone){
data.user.phone = data.user.email;
}
localStorage.setItem(
"rupaUser",
JSON.stringify(
data.user
)
);

alert(
"Login Successful"
);

window.location="/";

}

</script>

</body>
</html>
